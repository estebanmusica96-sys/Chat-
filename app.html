<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat Esteban — Chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><div class="onda-mark"><span></span><span></span><span></span><span></span><span></span></div>Chat Esteban</div>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" id="btn-perfil" title="Mi perfil">🙂</button>
        <button class="icon-btn" id="btn-tema" title="Modo oscuro">🌙</button>
        <button class="icon-btn" id="btn-nuevo-chat" title="Nuevo chat">💬</button>
        <button class="icon-btn" id="btn-nuevo-grupo" title="Nuevo grupo">👥</button>
        <button class="icon-btn" id="btn-logout" title="Cerrar sesión">⏻</button>
      </div>
    </div>
    <div style="padding:8px 20px;font-size:0.8rem;color:var(--ink-dim);border-bottom:1px solid var(--line)">
      Tu código: <span id="mi-codigo" style="font-family:var(--font-mono);font-weight:700;color:var(--coral)">--</span>
      <span style="color:var(--ink-faint)"> · compártelo para que te agreguen</span>
    </div>
    <div class="estados-bar" id="estados-bar"></div>
    <div class="search-box">
      <input type="text" id="buscar-conv" placeholder="Buscar conversación...">
    </div>
    <div class="conv-list" id="conv-list">
      <div class="empty-state"><p>Cargando tus chats...</p></div>
    </div>
  </aside>

  <!-- ===== CHAT PANE ===== -->
  <main class="chat-pane" id="chat-pane">
    <div class="empty-state" id="chat-empty">
      <div class="onda-mark" style="height:36px"><span></span><span></span><span></span><span></span><span></span></div>
      <p>Elige un chat o empieza uno nuevo</p>
    </div>

    <div id="chat-activo" style="display:none;flex-direction:column;height:100%">
      <div class="chat-head">
        <button class="back-btn" id="btn-back">←</button>
        <div class="avatar" id="chat-avatar">?</div>
        <div class="chat-head-info">
          <div class="chat-head-name" id="chat-nombre">—</div>
          <div class="chat-head-status" id="chat-status"></div>
        </div>
        <button class="icon-btn" id="btn-opciones-chat" title="Opciones del chat">⚙️</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <input type="file" id="input-imagen" accept="image/*">
        <input type="file" id="input-video" accept="video/*">
        <button class="icon-btn" id="btn-adjuntar" title="Enviar imagen">📷</button>
        <button class="icon-btn" id="btn-adjuntar-video" title="Enviar video">🎬</button>
        <button class="icon-btn" id="btn-ubicacion" title="Compartir ubicación">📍</button>
        <input type="text" id="texto-mensaje" placeholder="Escribe un mensaje...">
        <button class="icon-btn btn-fuego" id="btn-fuego" title="Mensaje que se autodestruye">🔥</button>
        <button class="icon-btn" id="btn-audio" title="Grabar audio">🎤</button>
        <button class="send-btn" id="btn-enviar" title="Enviar">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- ===== MODAL: nuevo chat / nuevo grupo ===== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-titulo">Nuevo chat</h3>
    <input type="text" id="modal-nombre-grupo" placeholder="Nombre del grupo" style="display:none;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;background:var(--bg-sunken)">

    <div style="display:flex;gap:8px;margin-bottom:6px">
      <input type="text" id="modal-codigo" placeholder="Código de 2 dígitos" maxlength="2" inputmode="numeric"
        style="flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-sunken);font-family:var(--font-mono);letter-spacing:0.1em">
      <button class="btn btn-primary" id="btn-buscar-codigo" style="width:auto;padding:10px 16px">Buscar</button>
    </div>
    <p id="codigo-error" style="color:#C43E1F;font-size:0.82rem;display:none;margin-bottom:8px"></p>

    <div class="modal-list" id="modal-list"></div>
    <button class="btn btn-primary" id="modal-confirmar" style="display:none">Crear grupo</button>
  </div>
</div>

<!-- ===== MODAL: mi perfil ===== -->
<div class="modal-bg" id="modal-perfil-bg">
  <div class="modal">
    <h3>Mi perfil</h3>
    <div class="avatar-upload">
      <div class="avatar" id="perfil-avatar-preview">?</div>
      <div>
        <input type="file" id="input-avatar" accept="image/*" style="display:none">
        <button class="btn btn-ghost" id="btn-cambiar-avatar" style="width:auto;padding:8px 14px;border:1px solid var(--line);border-radius:8px">Cambiar foto</button>
      </div>
    </div>
    <div class="field">
      <label>Tu nombre</label>
      <input type="text" id="perfil-nombre">
    </div>
    <button class="btn btn-primary" id="btn-guardar-perfil">Guardar</button>
    <p class="danger-link" id="btn-cerrar-modal-perfil" style="text-align:center;width:100%">Cerrar</p>
  </div>
</div>

<!-- ===== MODAL: crear estado ===== -->
<div class="modal-bg" id="modal-estado-bg">
  <div class="modal">
    <h3>Nuevo estado</h3>
    <div class="field">
      <label>Texto (se borra solo en 24 horas)</label>
      <input type="text" id="estado-texto" placeholder="¿Qué estás pensando?">
    </div>
    <p style="text-align:center;color:var(--ink-faint);font-size:0.82rem;margin-bottom:10px">o</p>
    <input type="file" id="input-estado-imagen" accept="image/*" style="margin-bottom:14px">
    <button class="btn btn-primary" id="btn-publicar-estado">Publicar</button>
  </div>
</div>

<!-- ===== VISOR DE ESTADOS ===== -->
<div class="estado-viewer" id="estado-viewer">
  <div class="estado-viewer-bar"><div class="estado-viewer-bar-fill" id="estado-viewer-fill"></div></div>
  <div class="estado-viewer-nombre" id="estado-viewer-nombre"></div>
  <div class="estado-viewer-close" id="estado-viewer-close">✕</div>
  <div class="estado-viewer-content" id="estado-viewer-content"></div>
</div>

<!-- ===== MODAL: opciones del chat (personalización) ===== -->
<div class="modal-bg" id="modal-opciones-bg">
  <div class="modal">
    <h3>Opciones del chat</h3>
    <div class="opciones-row" id="row-renombrar" style="display:none">
      <label>Nombre del grupo</label>
      <input type="text" id="opciones-nombre-grupo" style="width:160px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg-sunken)">
    </div>
    <div class="opciones-row">
      <label>Apodo (solo lo ves tú)</label>
      <input type="text" id="opciones-apodo" style="width:160px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg-sunken)">
    </div>
    <div class="opciones-row">
      <label>Color del chat</label>
      <div class="color-swatches" id="opciones-colores">
        <div class="color-swatch" data-color="#FF7EB6" style="background:#FF7EB6"></div>
        <div class="color-swatch" data-color="#9B6FC9" style="background:#9B6FC9"></div>
        <div class="color-swatch" data-color="#5FDBA6" style="background:#5FDBA6"></div>
        <div class="color-swatch" data-color="#FFB84D" style="background:#FFB84D"></div>
        <div class="color-swatch" data-color="#E8579A" style="background:#E8579A"></div>
      </div>
    </div>
    <div class="opciones-row" style="flex-direction:column;align-items:stretch">
      <label>Fondo de la conversación</label>
      <div class="color-swatches" id="opciones-fondos">
        <div class="color-swatch" data-fondo="#FFE6F1" style="background:#FFE6F1;border:1px solid var(--line)"></div>
        <div class="color-swatch" data-fondo="#FFD3E7" style="background:#FFD3E7"></div>
        <div class="color-swatch" data-fondo="#F3E9FB" style="background:#F3E9FB"></div>
        <div class="color-swatch" data-fondo="#E1F7EE" style="background:#E1F7EE"></div>
        <div class="color-swatch" data-fondo="#2E1A2B" style="background:#2E1A2B"></div>
      </div>
      <div class="fondo-upload-row">
        <div class="fondo-preview" id="fondo-preview"></div>
        <input type="file" id="input-fondo" accept="image/*" style="display:none">
        <button class="btn-chip" id="btn-subir-fondo" type="button">Usar una foto</button>
        <button class="btn-chip" id="btn-quitar-fondo" type="button">Quitar</button>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-guardar-opciones" style="margin-top:10px">Guardar</button>
    <p class="danger-link" id="btn-salir-grupo" style="display:none;text-align:center;width:100%">Salir del grupo</p>
    <p class="danger-link" id="btn-cerrar-modal-opciones" style="text-align:center;width:100%">Cerrar</p>
  </div>
</div>

<!-- ===== VISOR DE IMÁGENES (zoom) ===== -->
<div class="visor-imagen-bg" id="visor-imagen-bg">
  <div class="visor-imagen-cerrar" id="visor-imagen-cerrar">✕</div>
  <img id="visor-imagen-img" src="" alt="">
  <div class="visor-imagen-hint">Toca la foto para hacer zoom</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
