<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Chat Esteban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="onda-mark"><span></span><span></span><span></span><span></span><span></span></div>Chat Esteban</div>
    <p class="auth-tag">Inicia sesión para ver tus chats</p>

    <div id="msg" class="msg"></div>

    <form id="form-login">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <div class="auth-switch">¿No tienes cuenta? <a href="registro.html">Regístrate</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
const form = document.getElementById('form-login');
const msg = document.getElementById('msg');
function showMsg(text, type){ msg.textContent = text; msg.className = 'msg show ' + type; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { showMsg('Correo o contraseña incorrectos.', 'err'); return; }

  window.location.href = 'app.html';
});
</script>
</body>
</html>
